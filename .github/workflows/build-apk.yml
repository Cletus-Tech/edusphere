name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate wrapper jar in a scratch folder
        run: |
          mkdir -p /tmp/gw && cd /tmp/gw
          gradle wrapper --gradle-version 8.7
          cp gradlew "$GITHUB_WORKSPACE/android/gradlew"
          cp gradlew.bat "$GITHUB_WORKSPACE/android/gradlew.bat"
          cp gradle/wrapper/gradle-wrapper.jar "$GITHUB_WORKSPACE/android/gradle/wrapper/gradle-wrapper.jar"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - run: flutter pub get

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: edusphere-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
